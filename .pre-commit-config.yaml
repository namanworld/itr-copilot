repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        exclude: ^tests/fixtures/(01-full-87a-rebate|02-87a-marginal-relief|03-metro-hra-old-wins|04-home-loan-above-24b-cap|05-surcharge-marginal-relief)\.(new|old)\.pdf$
      - id: detect-private-key

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        pass_filenames: false
