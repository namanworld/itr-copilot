[project]
name = "itr"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.2",
]

[project.scripts]
itr = "itr:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "import-linter>=2.15",
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.importlinter]
root_package = "itr"

[tool.ruff]
line-length = 88
target-version = "py315"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: tests that call external APIs"]
addopts = "-m 'not integration'"

[[tool.importlinter.contracts]]
name = "Layered architecture"
type = "layers"
layers = [
    "itr.interfaces",
    "itr.infrastructure",
    "itr.application",
    "itr.domain",
]